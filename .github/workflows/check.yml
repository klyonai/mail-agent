name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run test:package
      - run: docker build -t mail-agent:check .
      - name: Verify actual image state permissions
        run: |
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges:true --entrypoint /usr/local/bin/node mail-agent:check -e "const s = require('node:fs').lstatSync('/state'); if (!s.isDirectory() || s.isSymbolicLink() || s.uid !== 1000 || s.gid !== 1000 || (s.mode & 0o7777) !== 0o700) throw new Error('Unsafe image state directory.');"
      - name: Verify upstream Node notice
        run: |
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges:true --entrypoint /usr/local/bin/node mail-agent:check -e "const fs = require('node:fs'); const s = fs.lstatSync('/usr/share/doc/node/LICENSE'); if (!s.isFile() || s.isSymbolicLink() || s.size !== 157609) throw new Error('Invalid upstream Node notice.'); const b = fs.readFileSync('/usr/share/doc/node/LICENSE'); if (b.length !== 157609 || require('node:crypto').createHash('sha256').update(b).digest('hex') !== '5888dbb9a1d2b18f2c3e6c5f6af1b39de658372b402a0577b002777f14c62ace') throw new Error('Invalid upstream Node notice.');"
      - run: docker run --rm --network none --read-only --tmpfs /tmp:size=64m,mode=1777 mail-agent:check preview /app/examples/request.json --config /app/examples/text-inbox/agent.yaml
      - name: Verify container license notice
        run: docker run --rm --network none --read-only --entrypoint node mail-agent:check -e "process.stdout.write(require('node:fs').readFileSync('/app/LICENSE'))" | cmp - LICENSE
