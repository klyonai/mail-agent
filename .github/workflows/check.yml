name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run test:package
      - run: docker build -t mail-agent:check .
      - run: docker run --rm --network none --read-only --tmpfs /tmp:size=64m,mode=1777 mail-agent:check preview /app/examples/request.json --config /app/examples/text-inbox/agent.yaml
      - name: Verify container license notice
        run: docker run --rm --network none --read-only --entrypoint node mail-agent:check -e "process.stdout.write(require('node:fs').readFileSync('/app/LICENSE'))" | cmp - LICENSE
