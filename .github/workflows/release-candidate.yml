name: Qualify versioned candidate
on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version matching the selected vVERSION tag
        required: true
        type: string
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.21.0'
          cache: npm
      - run: node scripts/release-candidate.mjs
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run test:package
      - run: npm audit --omit=dev
      - run: npm pack --ignore-scripts --json --pack-destination release > release/pack.json
      - name: Build and inspect container
        run: |
          docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" --label "org.opencontainers.image.version=$RELEASE_VERSION" -t "mail-agent:candidate-$RELEASE_VERSION" .
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges:true --entrypoint /usr/local/bin/node "mail-agent:candidate-$RELEASE_VERSION" -e "const s = require('node:fs').lstatSync('/state'); if (!s.isDirectory() || s.isSymbolicLink() || s.uid !== 1000 || s.gid !== 1000 || (s.mode & 0o7777) !== 0o700) throw new Error('Unsafe image state directory.');"
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges:true --entrypoint /usr/local/bin/node "mail-agent:candidate-$RELEASE_VERSION" -e "const fs = require('node:fs'); const s = fs.lstatSync('/usr/share/doc/node/LICENSE'); if (!s.isFile() || s.isSymbolicLink() || s.size !== 157609) throw new Error('Invalid upstream Node notice.'); const b = fs.readFileSync('/usr/share/doc/node/LICENSE'); if (b.length !== 157609 || require('node:crypto').createHash('sha256').update(b).digest('hex') !== '5888dbb9a1d2b18f2c3e6c5f6af1b39de658372b402a0577b002777f14c62ace') throw new Error('Invalid upstream Node notice.');"
          docker run --rm --network none --read-only --tmpfs /tmp:size=64m,mode=1777 "mail-agent:candidate-$RELEASE_VERSION" preview /app/examples/request.json --config /app/examples/text-inbox/agent.yaml
          docker run --rm --network none --read-only --entrypoint node "mail-agent:candidate-$RELEASE_VERSION" -e "process.stdout.write(require('node:fs').readFileSync('/app/LICENSE'))" | cmp - LICENSE
          docker image inspect "mail-agent:candidate-$RELEASE_VERSION" > release/image.json
          docker image save -o release/image.tar "mail-agent:candidate-$RELEASE_VERSION"
          cd release
          sha256sum *.tgz image.tar candidate.json pack.json image.json > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mail-agent-candidate-${{ inputs.version }}
          path: release/
          if-no-files-found: error
          retention-days: 7
