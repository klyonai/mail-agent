# Experimental recipe: qualify image interpretation and recipient arrival before deployment.
schema_version: 2
id: document-inbox
state_root: ./state
mailbox:
  provider: microsoft-graph
  tenant_id: example-tenant
  client_id: example-application
  client_secret_env: INBOX_GRAPH_CLIENT_SECRET
  address: assistant@example.org
  intake: delta-poll
  delivery: direct-reply
  sender_authentication:
    mode: exchange-authenticated
    trusted_authserv_ids: [example.org]
    transport_headers_verified: false
model:
  api: chat-completions
  base_url: https://models.example.org/v1
  api_key_env: INBOX_MODEL_API_KEY
  name: example-image-model
  capabilities: { tools: false, images: true, pdf: false }
  image_context_tokens: 8192
documents:
  images:
    enabled: true
    max_count: 4
    max_file_bytes: 5242880
    max_total_bytes: 10485760
    max_pixels: 12000000
  output:
    format: text-attachment
    filename: transcription.txt
    max_bytes: 262144
instructions:
  agent: AGENT.md
policy:
  senders: [alice@example.org]
  recipients: [alice@example.org]
  approvers: []
  reply: sender
  tools: {}
mcp: {}
limits:
  context_tokens: 65536
  output_tokens: 2048
retention:
  content_hours: 24
  audit_days: 30
